version: 2
updates:
  # Keeps SHA-pinned GitHub Actions up to date (pins are otherwise frozen forever).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
