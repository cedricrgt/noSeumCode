name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement SSH sur la VM
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRY_HOURS: ${{ secrets.JWT_EXPIRY_HOURS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          FRONTEND_DASHBOARD_URL: ${{ secrets.FRONTEND_DASHBOARD_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          FTP_SERVER_DEV: ${{ secrets.FTP_SERVER_DEV }}
          FTP_USERNAME_DEV: ${{ secrets.FTP_USERNAME_DEV }}
          FTP_PASSWORD_DEV: ${{ secrets.FTP_PASSWORD_DEV }}
          FTP_DIR_DEV: ${{ secrets.FTP_DIR_DEV }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_ROLE_STARTER_ID: ${{ secrets.DISCORD_ROLE_STARTER_ID }}
          DISCORD_ROLE_WEB_ID: ${{ secrets.DISCORD_ROLE_WEB_ID }}
          DISCORD_ROLE_VIP_ID: ${{ secrets.DISCORD_ROLE_VIP_ID }}
          DISCORD_ROLE_DEFAULT_ID: ${{ secrets.DISCORD_ROLE_DEFAULT_ID }}
          DISCORD_INVITE_URL: ${{ secrets.DISCORD_INVITE_URL }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DB_USERNAME,DB_PASSWORD,ADMIN_EMAIL,ADMIN_PASSWORD,JWT_SECRET,JWT_EXPIRY_HOURS,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,CORS_ALLOWED_ORIGINS,FRONTEND_DASHBOARD_URL,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,FTP_SERVER_DEV,FTP_USERNAME_DEV,FTP_PASSWORD_DEV,FTP_DIR_DEV,DISCORD_CLIENT_ID,DISCORD_CLIENT_SECRET,DISCORD_BOT_TOKEN,DISCORD_GUILD_ID,DISCORD_ROLE_STARTER_ID,DISCORD_ROLE_WEB_ID,DISCORD_ROLE_VIP_ID,DISCORD_ROLE_DEFAULT_ID,DISCORD_INVITE_URL
          script: |
            set -e

            cd ~/noSeumCode
            git fetch origin
            git reset --hard origin/develop

            # Génération du template .env
            cat > ~/noSeumCode/backend/.env.tpl << 'TPLEOF'
            SPRING_PROFILES_ACTIVE=prod
            SERVER_FORWARD_HEADERS_STRATEGY=framework
            DB_URL=jdbc:postgresql://postgres:5432/noseumcode
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GITHUB_CLIENT_ID=mock-github-client-id
            GITHUB_CLIENT_SECRET=mock-github-client-secret
            FACEBOOK_CLIENT_ID=mock-facebook-client-id
            FACEBOOK_CLIENT_SECRET=mock-facebook-client-secret
            DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
            DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
            DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
            DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
            DISCORD_ROLE_STARTER_ID=${DISCORD_ROLE_STARTER_ID}
            DISCORD_ROLE_WEB_ID=${DISCORD_ROLE_WEB_ID}
            DISCORD_ROLE_VIP_ID=${DISCORD_ROLE_VIP_ID}
            DISCORD_ROLE_DEFAULT_ID=${DISCORD_ROLE_DEFAULT_ID}
            DISCORD_INVITE_URL=${DISCORD_INVITE_URL:-https://discord.gg/noseumcode}
            FRONTEND_DASHBOARD_URL=${FRONTEND_DASHBOARD_URL}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://noseumcode.fr,https://www.noseumcode.fr,https://develop.noseumcode.fr,http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*,http://192.168.*,http://10.*}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            FTP_SERVER_DEV=${FTP_SERVER_DEV}
            FTP_USERNAME_DEV=${FTP_USERNAME_DEV}
            FTP_PASSWORD_DEV=${FTP_PASSWORD_DEV}
            FTP_DIR_DEV=${FTP_DIR_DEV}
            TPLEOF

            # Substitution sécurisée des variables uniquement
            VARS_TO_SUBST='$DB_USERNAME $DB_PASSWORD $ADMIN_EMAIL $ADMIN_PASSWORD $JWT_SECRET $JWT_EXPIRY_HOURS $GOOGLE_CLIENT_ID $GOOGLE_CLIENT_SECRET $FRONTEND_DASHBOARD_URL $CORS_ALLOWED_ORIGINS $STRIPE_SECRET_KEY $STRIPE_WEBHOOK_SECRET $FTP_SERVER_DEV $FTP_USERNAME_DEV $FTP_PASSWORD_DEV $FTP_DIR_DEV $DISCORD_CLIENT_ID $DISCORD_CLIENT_SECRET $DISCORD_BOT_TOKEN $DISCORD_GUILD_ID $DISCORD_ROLE_STARTER_ID $DISCORD_ROLE_WEB_ID $DISCORD_ROLE_VIP_ID $DISCORD_ROLE_DEFAULT_ID $DISCORD_INVITE_URL'
            sed 's/^[[:space:]]*//' ~/noSeumCode/backend/.env.tpl | envsubst "$VARS_TO_SUBST" > ~/noSeumCode/backend/.env
            chmod 600 ~/noSeumCode/backend/.env
            rm ~/noSeumCode/backend/.env.tpl

            # S'assurer que la base de données tourne et synchroniser les identifiants
            cd ~/noSeumCode/backend
            docker compose up -d postgres

            echo "Attente de la disponibilité de PostgreSQL..."
            docker compose exec -T postgres sh -c 'until pg_isready; do sleep 1; done'

            # Synchronisation idempotente de l'utilisateur et du mot de passe dans PostgreSQL
            docker compose exec -T postgres psql -U postgres -d postgres -c "CREATE USER \"$DB_USERNAME\" WITH PASSWORD '$DB_PASSWORD' ;" 2>/dev/null || true
            docker compose exec -T postgres psql -U postgres -d postgres -c "ALTER USER \"$DB_USERNAME\" WITH PASSWORD '$DB_PASSWORD';" 2>/dev/null || \
            docker compose exec -T postgres psql -U "$DB_USERNAME" -d postgres -c "ALTER USER \"$DB_USERNAME\" WITH PASSWORD '$DB_PASSWORD';" 2>/dev/null || true
            docker compose exec -T postgres psql -U postgres -d noseumcode -c "GRANT CONNECT ON DATABASE noseumcode TO \"$DB_USERNAME\";"
            docker compose exec -T postgres psql -U postgres -d noseumcode -c "GRANT USAGE, CREATE ON SCHEMA public TO \"$DB_USERNAME\";"
            docker compose exec -T postgres psql -U postgres -d noseumcode -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"$DB_USERNAME\";"
            docker compose exec -T postgres psql -U postgres -d noseumcode -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO \"$DB_USERNAME\";"
            docker compose exec -T postgres psql -U postgres -d noseumcode -c "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO \"$DB_USERNAME\";"
            docker compose exec -T postgres psql -U postgres -d noseumcode -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO \"$DB_USERNAME\";"



            # Rebuild et redémarrage du backend
            docker compose up -d --build --no-deps backend
            docker image prune -f

            # Diagnostic post-démarrage
            echo "Vérification du statut du backend..."
            sleep 10
            docker compose ps
            docker compose logs --tail=50 backend

            # Test de l'endpoint de santé
            echo "Vérification santé HTTP Actuator..."
            curl -f http://127.0.0.1:8080/actuator/health