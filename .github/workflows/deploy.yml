name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement SSH sur la VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Les secrets sont passés comme variables d'env dans le contexte SSH
          # Ils ne sont jamais écrits dans les logs.
          envs: DB_USERNAME,DB_PASSWORD,ADMIN_EMAIL,ADMIN_PASSWORD,JWT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,CORS_ALLOWED_ORIGINS,FRONTEND_DASHBOARD_URL
          script: |
            set -e

            cd ~/noSeumCode
            git fetch origin
            git reset --hard origin/develop

            # Réécriture du .env backend depuis les secrets GitHub
            # Garantit la reproductibilité si la VM est recréée
            cat > ~/noSeumCode/backend/.env.tpl << 'TPLEOF'
            SPRING_PROFILES_ACTIVE=prod
            SERVER_FORWARD_HEADERS_STRATEGY=framework
            DB_URL=jdbc:postgresql://postgres:5432/db
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRY_HOURS=1
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GITHUB_CLIENT_ID=mock-github-client-id
            GITHUB_CLIENT_SECRET=mock-github-client-secret
            FACEBOOK_CLIENT_ID=mock-facebook-client-id
            FACEBOOK_CLIENT_SECRET=mock-facebook-client-secret
            DISCORD_CLIENT_ID=mock-discord-client-id
            DISCORD_CLIENT_SECRET=mock-discord-client-secret
            FRONTEND_DASHBOARD_URL=${FRONTEND_DASHBOARD_URL}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            TPLEOF

            # Substitution des variables + suppression des espaces en début de ligne
            # (le heredoc YAML ajoute l'indentation du fichier en prefix de chaque ligne)
            sed 's/^[[:space:]]*//' ~/noSeumCode/backend/.env.tpl | envsubst > ~/noSeumCode/backend/.env
            chmod 600 ~/noSeumCode/backend/.env
            rm ~/noSeumCode/backend/.env.tpl

            # Rebuild et redémarrage du backend UNIQUEMENT (--no-deps = ne pas recréer postgres)
            cd ~/noSeumCode/backend
            docker compose up -d --build --no-deps backend
            docker image prune -f