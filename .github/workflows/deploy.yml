name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement SSH sur la VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRY_HOURS: ${{ secrets.JWT_EXPIRY_HOURS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          FRONTEND_DASHBOARD_URL: ${{ secrets.FRONTEND_DASHBOARD_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DB_USERNAME,DB_PASSWORD,ADMIN_EMAIL,ADMIN_PASSWORD,JWT_SECRET,JWT_EXPIRY_HOURS,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,CORS_ALLOWED_ORIGINS,FRONTEND_DASHBOARD_URL,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET
          script: |
            set -e

            cd ~/noSeumCode
            git fetch origin
            git reset --hard origin/develop

            # Génération du template .env
            cat > ~/noSeumCode/backend/.env.tpl << 'TPLEOF'
            SPRING_PROFILES_ACTIVE=prod
            SERVER_FORWARD_HEADERS_STRATEGY=framework
            DB_URL=jdbc:postgresql://noseumcode_db:5432/noseumcode
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            ADMIN_EMAIL=${ADMIN_EMAIL}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GITHUB_CLIENT_ID=mock-github-client-id
            GITHUB_CLIENT_SECRET=mock-github-client-secret
            FACEBOOK_CLIENT_ID=mock-facebook-client-id
            FACEBOOK_CLIENT_SECRET=mock-facebook-client-secret
            DISCORD_CLIENT_ID=mock-discord-client-id
            DISCORD_CLIENT_SECRET=mock-discord-client-secret
            FRONTEND_DASHBOARD_URL=${FRONTEND_DASHBOARD_URL}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://noseumcode.fr,https://www.noseumcode.fr,http://localhost:3000}
            STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
            STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            TPLEOF

            # Substitution et nettoyage
            sed 's/^[[:space:]]*//' ~/noSeumCode/backend/.env.tpl | envsubst > ~/noSeumCode/backend/.env
            chmod 600 ~/noSeumCode/backend/.env
            rm ~/noSeumCode/backend/.env.tpl

            # S'assurer que la base de données tourne et redémarrage du backend
            cd ~/noSeumCode/backend
            docker compose up -d postgres
            docker compose up -d --build --no-deps backend
            docker image prune -f

            # Diagnostic post-démarrage
            echo "Vérification du statut du backend..."
            sleep 10
            docker compose ps
            docker compose logs --tail=100 backend