name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL is provided by Testcontainers (profile "test", see
    # backend/src/test/resources/application-test.properties). ubuntu-latest ships a Docker daemon.
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: supersecretkeythatislongenoughforhs256token123
        run: ./mvnw -B test
