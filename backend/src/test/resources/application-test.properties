# Profile "test" (activated in CI via SPRING_PROFILES_ACTIVE=test).
# Loaded ON TOP of src/main/resources/application.properties: only override what differs.
# Do NOT name this file application.properties: it would shadow the main one on the test classpath.

# Ephemeral PostgreSQL 16 started by Testcontainers (requires a Docker daemon).
# Flyway migrations + Hibernate validate run against a real PostgreSQL, same major as production.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///db
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
