# =============================================================================
# PRODUCTION PROFILE — Security-hardened overrides
# Activer via : spring.profiles.active=prod
#           ou : variable d'env SPRING_PROFILES_ACTIVE=prod
# =============================================================================

# --- SQL / JPA : aucun log de requête ni de paramètre lié ---
# Empêche l'exposition de données utilisateur (emails, tokens, PII) dans les logs.
# Sans ces overrides, Hibernate loggue en TRACE les valeurs bindées (ex: emails, mots de passe hashés).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.tool.schema=WARN

# --- Spring Security : WARN suffisant en prod ---
# Le niveau DEBUG expose les décisions d'autorisation, les tokens et les détails des filtres.
logging.level.org.springframework.security=WARN

# --- Erreurs HTTP : ne jamais exposer les messages d'exception vers le client ---
# "always" peut leaker des stack traces ou des détails internes dans les réponses JSON.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
