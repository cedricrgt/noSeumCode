# =============================================================================
# PRODUCTION PROFILE — Security-hardened overrides
# Activer via : spring.profiles.active=prod
#           ou : variable d'env SPRING_PROFILES_ACTIVE=prod
# =============================================================================

# --- SQL / JPA : aucun log de requête ni de paramètre lié ---
# Empêche l'exposition de données utilisateur (emails, tokens, PII) dans les logs.
# Sans ces overrides, Hibernate loggue en TRACE les valeurs bindées (ex: emails, mots de passe hashés).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.tool.schema=WARN

# --- Spring Security : WARN suffisant en prod ---
# Le niveau DEBUG expose les décisions d'autorisation, les tokens et les détails des filtres.
logging.level.org.springframework.security=WARN

# --- Erreurs HTTP : ne jamais exposer les messages d'exception vers le client ---
# "always" peut leaker des stack traces ou des détails internes dans les réponses JSON.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Reverse Proxy / Forward Headers ---
# Indispensable derrière Nginx : permet à Spring Boot de reconstruire les URIs
# en HTTPS plutôt qu'en http://localhost:8080 (évite le redirect_uri_mismatch OAuth2).
# Sur la VM, SERVER_FORWARD_HEADERS_STRATEGY=framework dans le .env suffit,
# mais on le fixe ici pour garantir le comportement prod quelle que soit la source d'env.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# --- CORS Hardening (Sprint 26 / P1 & Staging Support) ---
# En production, interdiction formelle des domaines laxistes, IP locales et wildcards.
# Origines autorisées : frontends officiels NoSeumCode (prod & develop staging).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://noseumcode.fr,https://www.noseumcode.fr,https://develop.noseumcode.fr}

