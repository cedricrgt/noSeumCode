# Load .env file automatically
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties]

spring.application.name=backend

# Connexion PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - migrations via Flyway only, no auto DDL
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# SQL logs — DEV ONLY (overridés par application-prod.properties en production)
# /!\ TRACE sur jdbc.bind expose les valeurs des paramètres SQL (emails, tokens, PII)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.tool.schema=DEBUG

# Sécurité — DEV ONLY (overridé par application-prod.properties en production)
# /!\ DEBUG expose les filtres, tokens et décisions d'autorisation dans les logs
logging.level.org.springframework.security=DEBUG
# WARNING: "always" may expose exception details to HTTP clients — use "never" in production
server.error.include-message=always

# JWT Configuration — secret must be provided via JWT_SECRET env variable (no fallback allowed)
spring.security.oauth2.resourceserver.jwt.secret=${JWT_SECRET}
app.security.jwt-expiry-hours=${JWT_EXPIRY_HOURS:1}
app.security.refresh-token-validity-days=${REFRESH_TOKEN_VALIDITY_DAYS:7}
app.security.password-reset-validity-minutes=${PASSWORD_RESET_VALIDITY_MINUTES:30}
app.security.rate-limiting.enabled=${AUTH_RATE_LIMITING_ENABLED:true}
app.security.rate-limiting.max-per-minute=${AUTH_RATE_LIMITING_MAX:15}

# Mail Configuration (Brevo / SMTP / Transactional)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:noreply@noseumcode.fr}
app.frontend.reset-password-url=${RESET_PASSWORD_URL:https://noseumcode.fr/reset-password.html}

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_2BsFfeoXfXOvjtOnGf24JH6E00S9sVcIEG}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${STRIPE_SUCCESS_URL:https://noseumcode.fr/success.html}
stripe.cancel.url=${STRIPE_CANCEL_URL:https://noseumcode.fr/cours.html}
stripe.return.url=${STRIPE_RETURN_URL:https://noseumcode.fr/success.html}

# Admin Default Seed Credentials
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# OAuth2 Client Social Providers
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:mock-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:mock-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:mock-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:mock-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

# Discord (Custom Provider)
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:mock-discord-client-id}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:mock-discord-client-secret}
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Frontend Redirect on Login Success
app.oauth2.authorized-redirect-uri=${FRONTEND_DASHBOARD_URL:http://localhost:3000/dashboard.html}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,https://noseumcode.fr,https://www.noseumcode.fr}

# Active profile
# Active profile — override with SPRING_PROFILES_ACTIVE env var in production
# DEV: spring.profiles.active=dev
# PROD: spring.profiles.active=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}