# Load .env file automatically
spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# Connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=cedricragot
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - validation only in production, migrations via Flyway
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# SQL logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.tool.schema=DEBUG

# Sécurité
logging.level.org.springframework.security=DEBUG
server.error.include-message=always

# Better Auth signe ses JWT avec un secret — mets la même valeur que BETTER_AUTH_SECRET
spring.security.oauth2.resourceserver.jwt.secret=${BETTER_AUTH_SECRET:}