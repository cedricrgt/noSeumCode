<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoSeumCode - Site en construction 🚧</title>
    <meta
      name="description"
      content="NoSeumCode arrive bientôt ! Inscris-toi pour être informé du lancement de nos cours de programmation en ligne."
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bangers&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/pages/en-construction.css" />
    <link rel="stylesheet" href="styles/pages/homepage/footer.css" />
  </head>
  <body>
    <div class="coming-soon">
      <!-- Animated background particles -->
      <div class="coming-soon__particles" id="particles"></div>

      <!-- Main content -->
      <main class="coming-soon__content">
        <!-- Logo -->
        <div class="coming-soon__logo">
          <img
            alt="Logo de NoSeumCode"
            class="coming-soon__logo-img"
            src="images/header/logo.png"
          />
        </div>

        <!-- Badge -->
        <div class="coming-soon__badge">
          <span class="coming-soon__badge-dot"></span>
          En construction
        </div>

        <!-- Heading -->
        <h1 class="coming-soon__title bangers-regular">
          On code un <span class="gradient-text">banger</span> pour toi !
        </h1>

        <p class="coming-soon__subtitle poppins-regular">
          Notre site est en cours de construction. Laisse-nous tes coordonnées
          pour être informé du lancement et recevoir un accès anticipé exclusif ! 🚀
        </p>

        <!-- Features preview -->
        <div class="coming-soon__features">
          <div class="coming-soon__feature">
            <span class="coming-soon__feature-icon">🎓</span>
            <span class="coming-soon__feature-text">Cours en direct</span>
          </div>
          <div class="coming-soon__feature">
            <span class="coming-soon__feature-icon">💻</span>
            <span class="coming-soon__feature-text">Projets concrets</span>
          </div>
          <div class="coming-soon__feature">
            <span class="coming-soon__feature-icon">🏆</span>
            <span class="coming-soon__feature-text">Coaching perso</span>
          </div>
        </div>

        <!-- HubSpot Form Container -->
        <div class="coming-soon__form-container">
          <h2 class="coming-soon__form-title bangers-regular">
            Reste dans la boucle !
          </h2>
          <div id="hubspot-form" class="coming-soon__hubspot-form">
            <!-- IMPORTANT: Replace the portalId and formId below with your actual HubSpot values -->
            <!-- Le formulaire HubSpot sera chargé ici -->
          </div>
        </div>

        <!-- Social links -->
        <div class="coming-soon__socials">
          <a href="#" class="coming-soon__social-link" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
          <a href="#" class="coming-soon__social-link" aria-label="TikTok">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.72a8.26 8.26 0 0 0 4.76 1.5v-3.4a4.82 4.82 0 0 1-1-.13z"/>
            </svg>
          </a>
          <a href="#" class="coming-soon__social-link" aria-label="YouTube">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"></path>
              <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
            </svg>
          </a>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <div id="popovers-placeholder"></div>
    <!-- HubSpot Form Script -->
    <script charset="utf-8" type="text/javascript" src="//js-eu1.hsforms.net/forms/embed/v2.js"></script>
    <script>
      hbspt.forms.create({
        portalId: "147700205",
        formId: "1a00f0a3-c33c-47e3-9614-b56fdc4a8586",
        region: "eu1",
        target: "#hubspot-form",
      });
    </script>

    <!-- Dynamic Header/Footer Loader -->
    <script src="js/header.js"></script>

    <!-- Particle animation -->
    <script>
      (function () {
        const container = document.getElementById('particles');
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          particle.style.left = Math.random() * 100 + '%';
          particle.style.top = Math.random() * 100 + '%';
          particle.style.animationDelay = Math.random() * 6 + 's';
          particle.style.animationDuration = (4 + Math.random() * 6) + 's';
          const size = 2 + Math.random() * 4;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          container.appendChild(particle);
        }
      })();
    </script>
  </body>
</html>
