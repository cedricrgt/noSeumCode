<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace Formations - NoSeumCode</title>
    <meta name="description" id="meta-description" content="Espace de formations interactif et immersif NoSeumCode.">
    
    <meta property="og:title" id="og-title" content="NoSeumCode - Formations">
    <meta property="og:description" id="og-description" content="Découvrez nos formations pratiques et apprenez à coder sans le seum.">
    <meta property="og:image" id="og-image" content="">
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bangers&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bangers&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="styles/dist/article.min.css" />
    <link rel="stylesheet" href="styles/pages/cours.css" />
  </head>
  <body class="cours-page poppins-regular">
    <div id="header-placeholder"></div>

    <main id="cours-content">
      <div style="max-width: 1300px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center;">
        <p style="color: #94a3b8; font-size: 1.1rem;">Chargement de l'espace de formation...</p>
      </div>
    </main>

    <!-- Modale d'Édition / Création de Section (Teacher & Admin) -->
    <div id="chapter-edit-modal" class="course-modal-backdrop" style="display: none;">
      <div class="course-modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h3 id="modal-chapter-heading" style="font-family: 'Bangers', cursive; font-size: 1.8rem; color: #fff; margin: 0;">
            ✏️ MODIFIER LA SECTION
          </h3>
          <button type="button" onclick="closeChapterModal()" style="background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer;">✕</button>
        </div>

        <div id="modal-teacher-warning" class="role-notice-banner role-notice-teacher" style="display: none;">
          ⚠️ <strong>Rappel Enseignant :</strong> Toute modification sera automatiquement soumise à la validation d'un Administrateur avant d'être publiée pour les étudiants.
        </div>

        <form id="chapter-edit-form" onsubmit="handleSaveChapter(event)">
          <input type="hidden" id="modal-chapter-id" />
          <input type="hidden" id="modal-course-id" />
          
          <div style="margin-bottom: 1.25rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem;">Titre de la section</label>
            <input id="modal-chapter-title" required style="width: 100%; background: #070e18; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; padding: 0.75rem 1rem; font-size: 0.95rem; outline: none;" placeholder="ex: 1. Introduction à Spring Boot" />
          </div>

          <div style="margin-bottom: 1.25rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem;">Contenu (Markdown & Code)</label>
            <textarea id="modal-chapter-content" rows="10" required style="width: 100%; background: #070e18; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; padding: 0.75rem 1rem; font-size: 0.9rem; font-family: monospace; outline: none;" placeholder="# Titre principal&#10;&#10;Lorem ipsum dolor sit amet...&#10;&#10;```java&#10;// Votre code ici&#10;```"></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
            <button type="button" onclick="closeChapterModal()" class="button button__secondary" style="padding: 8px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; cursor: pointer;">
              Annuler
            </button>
            <button type="submit" id="modal-submit-btn" class="button button__primary bangers-regular" style="padding: 8px 24px; font-size: 1.1rem; border-radius: 8px; border: none; cursor: pointer;">
              ENREGISTRER
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modale d'Édition / Création de Cours (Teacher & Admin) -->
    <div id="course-manage-modal" class="course-modal-backdrop" style="display: none;">
      <div class="course-modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h3 id="modal-course-heading" style="font-family: 'Bangers', cursive; font-size: 1.8rem; color: #fff; margin: 0;">
            🎓 GESTION DU COURS
          </h3>
          <button type="button" onclick="closeCourseManageModal()" style="background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer;">✕</button>
        </div>

        <form id="course-manage-form" onsubmit="handleSaveCourse(event)">
          <input type="hidden" id="manage-course-id" />
          
          <div style="margin-bottom: 1.25rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem;">Titre de la formation</label>
            <input id="manage-course-title" required style="width: 100%; background: #070e18; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; padding: 0.75rem 1rem; font-size: 0.95rem; outline: none;" placeholder="ex: Fullstack Java 21 & Spring Boot 3" />
          </div>

          <div style="margin-bottom: 1.25rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem;">Description</label>
            <textarea id="manage-course-description" rows="4" required style="width: 100%; background: #070e18; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; padding: 0.75rem 1rem; font-size: 0.9rem; outline: none;" placeholder="Objectifs et compétences cibles de la formation..."></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
            <button type="button" onclick="closeCourseManageModal()" class="button button__secondary" style="padding: 8px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; cursor: pointer;">
              Annuler
            </button>
            <button type="submit" class="button button__primary bangers-regular" style="padding: 8px 24px; font-size: 1.1rem; border-radius: 8px; border: none; cursor: pointer;">
              ENREGISTRER
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/header.js"></script>
    <script src="js/cours.js"></script>

    <div id="popovers-placeholder"></div>
  </body>
</html>
