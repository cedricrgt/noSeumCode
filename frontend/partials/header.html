<header class="header">

  <!--<div class="promo-banner">
    <div class="promo-banner__track">
        <button popovertarget="promo-popup" class="promo-banner__cta bangers-regular">VOIR LE PLANNING</button></span>
    </div>
  </div>-->


  <input type="checkbox" id="burger-toggle" class="burger-toggle" aria-label="Basculer le menu mobile" />
  <div class="header__container">

    <label for="burger-toggle" class="burger-button" aria-label="Ouvrir le menu de navigation">
      <svg class="burger-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </label>

    <div class="header__logo">
      <a href="index.html" aria-label="Retour à l'accueil NoSeumCode">
        <img alt="Logo de NoSeumCode" class="logo__img" src="images/header/logo.png" width="160" height="120" />
      </a>
    </div>
    <div class="header__navbar">
      <nav class="navbar" aria-label="Navigation principale">
        <ul class="navbar__links poppins-regular">
          <li class="navbar__link"><a href="index.html">Accueil</a></li>
          <li class="navbar__link"><a href="cours.html">Formations</a></li>
          <li class="navbar__link"><a href="index.html#services">Nos services</a></li>
          <li class="navbar__link"><a href="index.html#faq">FAQ</a></li>
        </ul>
      </nav>
      <div class="header__actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <!-- Bouton Se connecter (visiteur non connecté) -->
        <button id="header-auth-btn" class="button button__secondary bangers-regular"
          onclick="openGlobalAuthModal('login')"
          style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; font-size: 1.1rem; border: none;">
          Se connecter
        </button>

        <!-- Profil connecté (affiché si token présent) -->
        <div id="header-user-badge" style="display: none; align-items: center; gap: 0.5rem;">
          <a href="dashboard.html" class="user-profile-pill"
            style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem; background: rgba(10, 22, 40, 0.9); padding: 0.35rem 0.8rem; border-radius: 30px; border: 1px solid rgba(0, 255, 135, 0.4); box-shadow: 0 0 10px rgba(0, 255, 135, 0.15);">
            <div id="header-user-avatar-text"
              style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #00ff87, #00d9ff); color: #070e18; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem;">
              U</div>
            <span id="header-user-name-text" style="font-weight: 600; font-size: 0.85rem; color: #fff;">Mon
              Espace</span>
          </a>
          <button onclick="globalLogout()" title="Déconnexion" aria-label="Se déconnecter de votre compte"
            style="background: rgba(255,51,102,0.15); border: 1px solid rgba(255,51,102,0.4); color: #ff3366; border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>

        <button class="button button__primary bangers-regular" popovertarget="hubspot-popover" aria-haspopup="dialog">
          Télécharger le programme
        </button>
      </div>
    </div>
  </div>
</header>
